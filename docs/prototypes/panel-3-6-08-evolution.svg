<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="1024" viewBox="0 0 1366 1024" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!--
    Panel 3-6-08 · Bunny 3-6 岁 × 3000 字架构 · 字时光机
    设计目的：
      把"3 岁 → 6 岁 → 9 岁 → 12 岁"四个年龄段的字量目标可视化，
      让孩子从小知道"读完这一岛还有下一岛，但每次只学一点点"。
      - 3 岁 启蒙：0-100 字（默认已学 47）
      - 6 岁 入学：300 字（小学 1 年级核心）
      - 9 岁 进阶：1500 字（小学 3 年级自由阅读）
      - 12 岁 自由：3000 字（自主阅读）
      单击每一阶段可以"穿越过去/未来"，看到该年龄对应的界面风格（Bunny 一样，但 UI 难度升级）。
  -->
  <defs>
    <linearGradient id="bg-time" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4E6"/>
      <stop offset="50%" stop-color="#FFE0BF"/>
      <stop offset="100%" stop-color="#D9C2F0"/>
    </linearGradient>
    <linearGradient id="card-time" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF9F0"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8E6CF"/>
      <stop offset="50%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#D9C2F0"/>
    </linearGradient>
    <filter id="shadow-time"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.18"/></filter>

    <symbol id="bunny-time" viewBox="-60 -60 120 120">
      <ellipse cx="-22" cy="-14" rx="9" ry="34" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2.5"/>
      <ellipse cx="-22" cy="-8" rx="4.5" ry="22" fill="#FFD3DC"/>
      <ellipse cx="22" cy="-14" rx="9" ry="34" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2.5"/>
      <ellipse cx="22" cy="-8" rx="4.5" ry="22" fill="#FFD3DC"/>
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2.5"/>
      <circle cx="-12" cy="-4" r="5" fill="#2C2C54"/>
      <circle cx="12" cy="-4" r="5" fill="#2C2C54"/>
      <circle cx="-10" cy="-6" r="2" fill="#FFFFFF"/>
      <circle cx="14" cy="-6" r="2" fill="#FFFFFF"/>
      <ellipse cx="-20" cy="8" rx="7" ry="5" fill="#FFC1CC" opacity="0.85"/>
      <ellipse cx="20" cy="8" rx="7" ry="5" fill="#FFC1CC" opacity="0.85"/>
      <ellipse cx="0" cy="14" rx="4" ry="2.5" fill="#FFC1CC"/>
      <path d="M -8 22 Q 0 30 8 22" stroke="#2C2C54" stroke-width="2" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1366" height="1024" fill="url(#bg-time)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1366" height="96" fill="#FFFFFF" opacity="0.92"/>
  <g transform="translate(56 48)">
    <circle r="32" fill="#FFE9A8" stroke="#EAE6DD" stroke-width="2"/>
    <text y="10" font-size="28" text-anchor="middle">←</text>
  </g>
  <text x="683" y="46" font-size="22" font-weight="700" fill="#2C2C54" text-anchor="middle">⏳ 字时光机</text>
  <text x="683" y="72" font-size="14" fill="#5C5C8A" text-anchor="middle">从 3 岁到 12 岁，Bunny 陪你走过 3000 字</text>
  <g transform="translate(1180 32)">
    <rect width="150" height="56" rx="28" fill="#FFE9A8"/>
    <text x="76" y="38" font-size="18" font-weight="700" fill="#7A4F00" text-anchor="middle">3 岁 · 47 字</text>
  </g>

  <!-- 时间线主体 -->
  <g transform="translate(40 130)">
    <rect width="1286" height="600" rx="36" fill="url(#card-time)" filter="url(#shadow-time)"/>
    <text x="36" y="40" font-size="20" font-weight="700" fill="#2C2C54">🌱 你正在这里</text>
    <text x="36" y="62" font-size="13" fill="#5C5C8A">下一步：每学 3-5 字 / 天，每次 5-10 分钟</text>

    <!-- 时间轨道 -->
    <g transform="translate(0 130)">
      <rect x="80" y="32" width="1126" height="14" rx="7" fill="url(#track)" opacity="0.4"/>
      <!-- 当前位置标记 -->
      <g transform="translate(140 24)">
        <text x="0" y="-12" font-size="14" font-weight="700" fill="#1F6A4D">现在</text>
        <circle cx="0" cy="14" r="20" fill="#39B86A" stroke="#FFFFFF" stroke-width="4"/>
        <text x="0" y="22" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">🐰</text>
      </g>
    </g>

    <!-- 4 个阶段卡片 -->
    <!-- 阶段 1 · 3 岁 · 启蒙 -->
    <g transform="translate(40 200)">
      <rect width="280" height="320" rx="32" fill="#A8E6CF" filter="url(#shadow-time)"/>
      <g transform="translate(140 50)">
        <text y="0" font-size="40" text-anchor="middle">🌱</text>
      </g>
      <text x="140" y="120" font-size="22" font-weight="700" fill="#1F6A4D" text-anchor="middle">3 岁 · 启蒙</text>
      <text x="140" y="148" font-size="14" fill="#1F6A4D" text-anchor="middle">学 50 - 100 字</text>
      <!-- 当前 -->
      <g transform="translate(20 170)">
        <rect width="240" height="56" rx="16" fill="#FFFFFF" stroke="#39B86A" stroke-width="3"/>
        <text x="120" y="24" font-size="13" font-weight="700" fill="#1F6A4D" text-anchor="middle">现在 · 已学 47 字</text>
        <text x="120" y="46" font-size="12" fill="#1F6A4D" text-anchor="middle">每天 3-5 字 · 5-10 分钟</text>
      </g>
      <!-- 内容形态 -->
      <g transform="translate(20 240)">
        <text x="0" y="14" font-size="12" font-weight="700" fill="#1F6A4D">这个阶段你会看到：</text>
        <text x="0" y="36" font-size="12" fill="#1F6A4D">• 大 Bunny · 大按钮</text>
        <text x="0" y="52" font-size="12" fill="#1F6A4D">• 图 → 字 · 拟人汉字</text>
        <text x="0" y="68" font-size="12" fill="#1F6A4D">• 不打分 · 不排名</text>
      </g>
    </g>

    <!-- 阶段 2 · 6 岁 · 入学 -->
    <g transform="translate(340 200)">
      <rect width="280" height="320" rx="32" fill="#FFE9A8" filter="url(#shadow-time)"/>
      <g transform="translate(140 50)">
        <text y="0" font-size="40" text-anchor="middle">📚</text>
      </g>
      <text x="140" y="120" font-size="22" font-weight="700" fill="#7A4F00" text-anchor="middle">6 岁 · 入学</text>
      <text x="140" y="148" font-size="14" fill="#7A4F00" text-anchor="middle">学到 300 字</text>
      <g transform="translate(20 170)">
        <rect width="240" height="56" rx="16" fill="#FFFFFF" stroke="#FFC76B" stroke-width="3"/>
        <text x="120" y="24" font-size="13" font-weight="700" fill="#7A4F00" text-anchor="middle">下一关 · 253 字</text>
        <text x="120" y="46" font-size="12" fill="#7A4F00" text-anchor="middle">每天 5-8 字 · 10-15 分钟</text>
      </g>
      <g transform="translate(20 240)">
        <text x="0" y="14" font-size="12" font-weight="700" fill="#7A4F00">这个阶段你会看到：</text>
        <text x="0" y="36" font-size="12" fill="#7A4F00">• 教材同步绘本</text>
        <text x="0" y="52" font-size="12" fill="#7A4F00">• 字源故事 · 词语</text>
        <text x="0" y="68" font-size="12" fill="#7A4F00">• 跟读评分（依旧鼓励）</text>
      </g>
    </g>

    <!-- 阶段 3 · 9 岁 · 进阶 -->
    <g transform="translate(640 200)">
      <rect width="280" height="320" rx="32" fill="#B5DEFF" filter="url(#shadow-time)"/>
      <g transform="translate(140 50)">
        <text y="0" font-size="40" text-anchor="middle">🌉</text>
      </g>
      <text x="140" y="120" font-size="22" font-weight="700" fill="#3F4C7A" text-anchor="middle">9 岁 · 进阶</text>
      <text x="140" y="148" font-size="14" fill="#3F4C7A" text-anchor="middle">学到 1500 字</text>
      <g transform="translate(20 170)">
        <rect width="240" height="56" rx="16" fill="#FFFFFF" stroke="#7CCFAF" stroke-width="3"/>
        <text x="120" y="24" font-size="13" font-weight="700" fill="#3F4C7A" text-anchor="middle">远方 · 还要学 1200 字</text>
        <text x="120" y="46" font-size="12" fill="#3F4C7A" text-anchor="middle">每章 5-10 字 · 15 分钟</text>
      </g>
      <g transform="translate(20 240)">
        <text x="0" y="14" font-size="12" font-weight="700" fill="#3F4C7A">这个阶段你会看到：</text>
        <text x="0" y="36" font-size="12" fill="#3F4C7A">• 偏旁 · 汉字家族</text>
        <text x="0" y="52" font-size="12" fill="#3F4C7A">• 句子解谜 · 阅读理解</text>
        <text x="0" y="68" font-size="12" fill="#3F4C7A">• 写短句 · 看图表达</text>
      </g>
    </g>

    <!-- 阶段 4 · 12 岁 · 自由 -->
    <g transform="translate(940 200)">
      <rect width="306" height="320" rx="32" fill="#D9C2F0" filter="url(#shadow-time)"/>
      <g transform="translate(153 50)">
        <text y="0" font-size="40" text-anchor="middle">🌌</text>
      </g>
      <text x="153" y="120" font-size="22" font-weight="700" fill="#7B5EAB" text-anchor="middle">12 岁 · 自由阅读</text>
      <text x="153" y="148" font-size="14" fill="#7B5EAB" text-anchor="middle">学到 3000 字</text>
      <g transform="translate(20 170)">
        <rect width="266" height="56" rx="16" fill="#FFFFFF" stroke="#7B5EAB" stroke-width="3"/>
        <text x="133" y="24" font-size="13" font-weight="700" fill="#7B5EAB" text-anchor="middle">远方 · 还要学 1500 字</text>
        <text x="133" y="46" font-size="12" fill="#7B5EAB" text-anchor="middle">自主阅读 · 章节书</text>
      </g>
      <g transform="translate(20 240)">
        <text x="0" y="14" font-size="12" font-weight="700" fill="#7B5EAB">这个阶段你会看到：</text>
        <text x="0" y="36" font-size="12" fill="#7B5EAB">• 原创故事 · 文化阅读</text>
        <text x="0" y="52" font-size="12" fill="#7B5EAB">• 汉字文化 · 古诗</text>
        <text x="0" y="68" font-size="12" fill="#7B5EAB">• 你写自己的故事</text>
      </g>
    </g>

    <!-- 阶段间箭头 -->
    <g stroke="#2C2C54" stroke-width="3" fill="none">
      <line x1="324" y1="370" x2="338" y2="370"/>
      <line x1="624" y1="370" x2="638" y2="370"/>
      <line x1="924" y1="370" x2="938" y2="370"/>
    </g>
  </g>

  <!-- 底部 Bunny + 鼓励条 -->
  <g transform="translate(40 750)">
    <rect width="1286" height="160" rx="32" fill="#A8E6CF" filter="url(#shadow-time)"/>
    <use href="#bunny-time" x="20" y="20" width="120" height="120"/>
    <g transform="translate(160 36)">
      <text x="0" y="0" font-size="22" font-weight="700" fill="#1F6A4D">不要急，慢慢来</text>
      <text x="0" y="30" font-size="16" fill="#1F6A4D">今天学 3 个字，明天学 3 个字</text>
      <text x="0" y="56" font-size="16" fill="#1F6A4D">一年下来，你就是小学霸啦！</text>
      <text x="0" y="86" font-size="13" fill="#1F6A4D" opacity="0.85">Bunny 会一直陪着你，从第一棵小苗，到 3000 颗星星。</text>
    </g>
    <!-- 数字 -->
    <g transform="translate(1080 26)">
      <rect width="180" height="108" rx="24" fill="#FFFFFF"/>
      <text x="90" y="38" font-size="14" font-weight="700" fill="#5C5C8A" text-anchor="middle">3 年后你能读</text>
      <text x="90" y="76" font-size="32" font-weight="700" fill="#E94545" text-anchor="middle">300 字</text>
      <text x="90" y="98" font-size="11" fill="#7A4F00" text-anchor="middle">9 年后 3000 字</text>
    </g>
  </g>

  <!-- 底部 6 tab 底栏 -->
  <rect x="0" y="936" width="1366" height="88" fill="#FFFFFF" stroke="#EAE6DD" stroke-width="1"/>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <g transform="translate(114 950)"><text y="22" font-size="28" fill="#5C5C8A">🏝️</text><text y="56" fill="#5C5C8A">首页</text></g>
    <g transform="translate(341 950)"><text y="22" font-size="28" fill="#5C5C8A">📖</text><text y="56" fill="#5C5C8A">故事</text></g>
    <g transform="translate(569 950)"><text y="22" font-size="28" fill="#5C5C8A">🌸</text><text y="56" fill="#5C5C8A">汉字</text></g>
    <g transform="translate(797 950)"><text y="22" font-size="28" fill="#5C5C8A">🎮</text><text y="56" fill="#5C5C8A">游戏</text></g>
    <g transform="translate(1024 950)"><text y="22" font-size="28" fill="#5C5C8A">🌳</text><text y="56" fill="#5C5C8A">字花园</text></g>
    <g transform="translate(1252 950)"><text y="22" font-size="28" fill="#5C5C8A">🐰</text><text y="56" fill="#5C5C8A">家长</text></g>
  </g>
</svg>