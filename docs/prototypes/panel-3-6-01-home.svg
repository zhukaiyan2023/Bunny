<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="1024" viewBox="0 0 1366 1024" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!--
    Panel 3-6-01 · Bunny 3-6 岁专属 · 世界地图 / 首页
    对应 src/pages/home/HomePage.tsx 的低龄分支。
    设计原则：
      - 大 Bunny 在画面中央偏右，1.5 头身，全程陪伴
      - 4 大岛：故事岛 / 汉字花园 / 玩游戏 / 我的小屋
      - 每个岛 ≥ 240×220 触控目标，主 CTA 接近 120px
      - 屏幕汉字 ≤ 14 个 + 大图标；图标带表情
      - 永不负面反馈；星数进度代替百分比
  -->
  <defs>
    <linearGradient id="bg-home-3-6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4E6"/>
      <stop offset="55%" stop-color="#FFE0BF"/>
      <stop offset="100%" stop-color="#B5DEFF"/>
    </linearGradient>
    <linearGradient id="card-home-3-6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF9F0"/>
    </linearGradient>
    <linearGradient id="island-story" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#FFC76B"/>
    </linearGradient>
    <linearGradient id="island-chars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C6F0D8"/>
      <stop offset="100%" stop-color="#6FD7A0"/>
    </linearGradient>
    <linearGradient id="island-game" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B5DEFF"/>
      <stop offset="100%" stop-color="#7CCFAF"/>
    </linearGradient>
    <linearGradient id="island-home" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC1CC"/>
      <stop offset="100%" stop-color="#FF9F43"/>
    </linearGradient>
    <filter id="shadow-home-3-6"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.18"/></filter>

    <!-- 拟人化眼睛 -->
    <symbol id="big-eye" viewBox="-30 -30 60 60">
      <circle cx="-22" cy="-30" r="6" fill="#2C2C54"/>
      <circle cx="22" cy="-30" r="6" fill="#2C2C54"/>
      <circle cx="-20" cy="-32" r="2.5" fill="#FFFFFF"/>
      <circle cx="24" cy="-32" r="2.5" fill="#FFFFFF"/>
      <ellipse cx="-30" cy="-12" rx="9" ry="6" fill="#FFC1CC" opacity="0.85"/>
      <ellipse cx="30" cy="-12" rx="9" ry="6" fill="#FFC1CC" opacity="0.85"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1366" height="1024" fill="url(#bg-home-3-6)"/>

  <!-- 装饰：天空云朵 -->
  <g opacity="0.55">
    <ellipse cx="180" cy="160" rx="46" ry="14" fill="#FFFFFF"/>
    <ellipse cx="200" cy="146" rx="28" ry="12" fill="#FFFFFF"/>
    <ellipse cx="1100" cy="220" rx="50" ry="16" fill="#FFFFFF"/>
    <ellipse cx="1130" cy="204" rx="32" ry="14" fill="#FFFFFF"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="1366" height="96" fill="#FFFFFF" opacity="0.92"/>
  <g transform="translate(40 48)">
    <!-- mini Bunny head -->
    <g>
      <ellipse cx="-22" cy="-14" rx="9" ry="22" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2.5"/>
      <ellipse cx="-22" cy="-10" rx="4.5" ry="14" fill="#FFD3DC"/>
      <ellipse cx="22" cy="-14" rx="9" ry="22" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2.5"/>
      <ellipse cx="22" cy="-10" rx="4.5" ry="14" fill="#FFD3DC"/>
      <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2.5"/>
      <circle cx="-8" cy="-3" r="3.5" fill="#2C2C54"/>
      <circle cx="8" cy="-3" r="3.5" fill="#2C2C54"/>
      <ellipse cx="-14" cy="6" rx="6" ry="4" fill="#FFC1CC"/>
      <ellipse cx="14" cy="6" rx="6" ry="4" fill="#FFC1CC"/>
      <path d="M -5 10 Q 0 14 5 10" stroke="#2C2C54" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <text x="60" y="-6" font-size="22" font-weight="700" fill="#2C2C54">你好，小朋友！</text>
    <text x="60" y="18" font-size="14" fill="#5C5C8A">今天我们一起玩～</text>
  </g>
  <!-- 3000 字进度（替换原星星数） -->
  <g transform="translate(1140 28)">
    <rect width="190" height="64" rx="32" fill="#A8E6CF"/>
    <text x="32" y="40" font-size="22" text-anchor="middle">🌱</text>
    <text x="64" y="28" font-size="12" font-weight="700" fill="#1F6A4D">已学</text>
    <text x="64" y="50" font-size="20" font-weight="700" fill="#1F6A4D">47 / 3000</text>
  </g>

  <!-- 大 Bunny 在画面中央偏左 -->
  <g transform="translate(160 480)">
    <!-- 脚 -->
    <ellipse cx="-32" cy="148" rx="26" ry="14" fill="#FFFFFF" stroke="#2C2C54" stroke-width="3"/>
    <ellipse cx="32" cy="148" rx="26" ry="14" fill="#FFFFFF" stroke="#2C2C54" stroke-width="3"/>
    <!-- 身体 -->
    <ellipse cx="0" cy="80" rx="88" ry="72" fill="#FFFFFF" stroke="#2C2C54" stroke-width="3"/>
    <!-- 书包 -->
    <path d="M -42 50 L -50 116 Q -50 128 -38 128 L 38 128 Q 50 128 50 116 L 42 50 Z" fill="#E94545" stroke="#2C2C54" stroke-width="3"/>
    <rect x="-10" y="86" width="20" height="10" rx="2" fill="#FFFFFF"/>
    <circle cx="0" cy="78" r="4" fill="#FFD15C"/>
    <!-- 长垂耳（左） -->
    <path d="M -34 -10 Q -50 -10 -54 14 Q -58 60 -46 80 Q -28 80 -22 60 Q -22 14 -22 -10 Z" fill="#FFFFFF" stroke="#2C2C54" stroke-width="3"/>
    <path d="M -34 -2 Q -42 14 -44 42 Q -46 74 -36 76 Q -28 56 -28 34 Q -28 4 -28 -2 Z" fill="#FFD3DC"/>
    <!-- 长垂耳（右） -->
    <path d="M 34 -10 Q 50 -10 54 14 Q 58 60 46 80 Q 28 80 22 60 Q 22 14 22 -10 Z" fill="#FFFFFF" stroke="#2C2C54" stroke-width="3"/>
    <path d="M 34 -2 Q 42 14 44 42 Q 46 74 36 76 Q 28 56 28 34 Q 28 4 28 -2 Z" fill="#FFD3DC"/>
    <!-- 头 -->
    <circle cx="0" cy="0" r="60" fill="#FFFFFF" stroke="#2C2C54" stroke-width="3"/>
    <!-- 腮红 -->
    <ellipse cx="-34" cy="14" rx="13" ry="8" fill="#FFC1CC" opacity="0.85"/>
    <ellipse cx="34" cy="14" rx="13" ry="8" fill="#FFC1CC" opacity="0.85"/>
    <!-- 眼睛 -->
    <circle cx="-20" cy="-10" r="8" fill="#2C2C54"/>
    <circle cx="20" cy="-10" r="8" fill="#2C2C54"/>
    <circle cx="-18" cy="-13" r="3" fill="#FFFFFF"/>
    <circle cx="22" cy="-13" r="3" fill="#FFFFFF"/>
    <!-- 鼻子 -->
    <ellipse cx="0" cy="10" rx="5" ry="3.5" fill="#FFC1CC"/>
    <!-- 嘴 -->
    <path d="M -10 18 Q 0 28 10 18" stroke="#2C2C54" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- 抬手 -->
    <ellipse cx="-78" cy="40" rx="18" ry="10" fill="#FFFFFF" stroke="#2C2C54" stroke-width="3" transform="rotate(-25 -78 40)"/>
  </g>

  <!-- Bunny 对话气泡（含 3000 字进度） -->
  <g transform="translate(290 380)">
    <rect width="280" height="100" rx="24" fill="#FFFFFF" stroke="#EAE6DD" stroke-width="2"/>
    <path d="M 16 96 L 24 112 L 38 96 Z" fill="#FFFFFF" stroke="#EAE6DD" stroke-width="2"/>
    <text x="22" y="34" font-size="18" font-weight="700" fill="#2C2C54">家岛上你已种</text>
    <text x="22" y="60" font-size="22" font-weight="700" fill="#E94545">47 棵小苗啦！</text>
    <text x="22" y="84" font-size="13" fill="#5C5C8A">今天再去种 3 棵吧</text>
  </g>

  <!-- 4 大岛 -->
  <!-- 故事岛 -->
  <g transform="translate(620 220)">
    <ellipse cx="160" cy="160" rx="170" ry="140" fill="url(#island-story)" filter="url(#shadow-home-3-6)"/>
    <ellipse cx="160" cy="248" rx="120" ry="24" fill="#6FD7A0" opacity="0.5"/>
    <!-- 拟人图标：书 -->
    <g transform="translate(160 100)">
      <rect x="-50" y="-32" width="100" height="64" rx="10" fill="#FFFFFF" stroke="#2C2C54" stroke-width="3"/>
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#2C2C54" stroke-width="2"/>
      <use href="#big-eye" x="-72" y="-58" width="60" height="60"/>
      <use href="#big-eye" x="12" y="-58" width="60" height="60"/>
    </g>
    <text x="160" y="208" font-size="26" font-weight="700" fill="#2C2C54" text-anchor="middle">故事岛</text>
    <text x="160" y="234" font-size="14" fill="#7A4F00" text-anchor="middle">Bunny 讲故事</text>
    <!-- 3000 字进度 -->
    <g transform="translate(80 250)">
      <rect width="160" height="22" rx="11" fill="#FFFFFF" opacity="0.9"/>
      <text x="80" y="16" font-size="12" font-weight="700" fill="#7A4F00" text-anchor="middle">本岛 300 字 · 已读 12 本</text>
    </g>
  </g>

  <!-- 汉字花园 -->
  <g transform="translate(1020 220)">
    <ellipse cx="160" cy="160" rx="170" ry="140" fill="url(#island-chars)" filter="url(#shadow-home-3-6)"/>
    <ellipse cx="160" cy="248" rx="120" ry="24" fill="#6FD7A0" opacity="0.55"/>
    <!-- 拟人图标：花 -->
    <g transform="translate(160 100)">
      <circle cx="-30" cy="-8" r="14" fill="#FFC1CC" stroke="#2C2C54" stroke-width="2"/>
      <circle cx="30" cy="-8" r="14" fill="#FFC1CC" stroke="#2C2C54" stroke-width="2"/>
      <circle cx="0" cy="14" r="14" fill="#FFC1CC" stroke="#2C2C54" stroke-width="2"/>
      <circle cx="0" cy="-2" r="14" fill="#FFD15C" stroke="#2C2C54" stroke-width="2"/>
      <use href="#big-eye" x="-32" y="-26" width="60" height="60"/>
    </g>
    <text x="160" y="208" font-size="26" font-weight="700" fill="#2C2C54" text-anchor="middle">汉字花园</text>
    <text x="160" y="234" font-size="14" fill="#1F6A4D" text-anchor="middle">和字做朋友</text>
    <!-- 3000 字进度 -->
    <g transform="translate(80 250)">
      <rect width="160" height="22" rx="11" fill="#FFFFFF" opacity="0.9"/>
      <text x="80" y="16" font-size="12" font-weight="700" fill="#1F6A4D" text-anchor="middle">家岛 · 已学 47/300</text>
    </g>
  </g>

  <!-- 玩游戏 -->
  <g transform="translate(620 540)">
    <ellipse cx="160" cy="140" rx="170" ry="120" fill="url(#island-game)" filter="url(#shadow-home-3-6)"/>
    <ellipse cx="160" cy="220" rx="120" ry="20" fill="#7CCFAF" opacity="0.5"/>
    <!-- 拟人图标：手柄 -->
    <g transform="translate(160 84)">
      <rect x="-50" y="-22" width="100" height="44" rx="14" fill="#FFFFFF" stroke="#2C2C54" stroke-width="3"/>
      <circle cx="-30" cy="0" r="6" fill="#E94545"/>
      <circle cx="30" cy="0" r="6" fill="#6FD7A0"/>
      <use href="#big-eye" x="-72" y="-46" width="60" height="60"/>
      <use href="#big-eye" x="12" y="-46" width="60" height="60"/>
    </g>
    <text x="160" y="180" font-size="26" font-weight="700" fill="#2C2C54" text-anchor="middle">玩游戏</text>
    <text x="160" y="206" font-size="14" fill="#3F4C7A" text-anchor="middle">找一找</text>
    <g transform="translate(80 222)">
      <rect width="160" height="22" rx="11" fill="#FFFFFF" opacity="0.9"/>
      <text x="80" y="16" font-size="12" font-weight="700" fill="#3F4C7A" text-anchor="middle">5 类游戏 · 闯到第 8 关</text>
    </g>
  </g>

  <!-- 我的小屋 -->
  <g transform="translate(1020 540)">
    <ellipse cx="160" cy="140" rx="170" ry="120" fill="url(#island-home)" filter="url(#shadow-home-3-6)"/>
    <ellipse cx="160" cy="220" rx="120" ry="20" fill="#FF9F43" opacity="0.5"/>
    <!-- 拟人图标：小屋 -->
    <g transform="translate(160 84)">
      <path d="M -44 16 L -44 -8 L 0 -38 L 44 -8 L 44 16 Z" fill="#FFFFFF" stroke="#2C2C54" stroke-width="3"/>
      <rect x="-12" y="0" width="24" height="20" fill="#E94545" stroke="#2C2C54" stroke-width="2"/>
      <use href="#big-eye" x="-72" y="-46" width="60" height="60"/>
      <use href="#big-eye" x="12" y="-46" width="60" height="60"/>
    </g>
    <text x="160" y="180" font-size="26" font-weight="700" fill="#2C2C54" text-anchor="middle">我的小屋</text>
    <text x="160" y="206" font-size="14" fill="#7A2A4D" text-anchor="middle">收集勋章</text>
    <g transform="translate(80 222)">
      <rect width="160" height="22" rx="11" fill="#FFFFFF" opacity="0.9"/>
      <text x="80" y="16" font-size="12" font-weight="700" fill="#7A2A4D" text-anchor="middle">已拿 6 枚勋章</text>
    </g>
  </g>

  <!-- 底部 6 tab 底栏 -->
  <rect x="0" y="936" width="1366" height="88" fill="#FFFFFF" stroke="#EAE6DD" stroke-width="1"/>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <!-- 当前选中：首页 -->
    <g transform="translate(114 950)">
      <rect x="-30" y="-8" width="60" height="60" rx="30" fill="#E94545"/>
      <text y="32" font-size="28" fill="#FFFFFF">🏝️</text>
      <text y="62" font-size="12" font-weight="700" fill="#E94545">首页</text>
    </g>
    <g transform="translate(341 950)"><text y="22" font-size="28" fill="#5C5C8A">📖</text><text y="56" fill="#5C5C8A">故事</text></g>
    <g transform="translate(569 950)"><text y="22" font-size="28" fill="#5C5C8A">🌸</text><text y="56" fill="#5C5C8A">汉字</text></g>
    <g transform="translate(797 950)"><text y="22" font-size="28" fill="#5C5C8A">🎮</text><text y="56" fill="#5C5C8A">游戏</text></g>
    <g transform="translate(1024 950)"><text y="22" font-size="28" fill="#5C5C8A">🏠</text><text y="56" fill="#5C5C8A">小屋</text></g>
    <g transform="translate(1252 950)"><text y="22" font-size="28" fill="#5C5C8A">🐰</text><text y="56" fill="#5C5C8A">家长</text></g>
  </g>
</svg>