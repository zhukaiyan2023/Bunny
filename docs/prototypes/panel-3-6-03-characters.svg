<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="1024" viewBox="0 0 1366 1024" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!--
    Panel 3-6-03 · Bunny 3-6 岁专属 · 汉字花园
    设计原则：
      - 先图后字：图 → 字 1 步，不引入字源 / 演变 / 词语
      - 拟人化汉字方块（每个 ≥ 140px），带圆眼睛 + 腮红
      - 主字卡 ≥ 240px 大字 + 拼音 + Bunny 跟读
      - 切换节奏：3-5 字 / 课，5-7 分钟完成
      - 永不负面反馈；学完变金色 ★
  -->
  <defs>
    <linearGradient id="bg-char-3-6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4E6"/>
      <stop offset="50%" stop-color="#FFE0BF"/>
      <stop offset="100%" stop-color="#D9C2F0"/>
    </linearGradient>
    <linearGradient id="card-char-3-6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF9F0"/>
    </linearGradient>
    <linearGradient id="hero-char" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF4E6"/>
    </linearGradient>
    <linearGradient id="next-card-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC1CC"/>
      <stop offset="100%" stop-color="#FF9F43"/>
    </linearGradient>
    <linearGradient id="next-card-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B5DEFF"/>
      <stop offset="100%" stop-color="#7CCFAF"/>
    </linearGradient>
    <linearGradient id="next-card-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8E6CF"/>
      <stop offset="100%" stop-color="#39B86A"/>
    </linearGradient>
    <filter id="shadow-char-3-6"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.18"/></filter>

    <symbol id="char-eye" viewBox="-30 -30 60 60">
      <circle cx="-22" cy="-30" r="6" fill="#2C2C54"/>
      <circle cx="22" cy="-30" r="6" fill="#2C2C54"/>
      <circle cx="-20" cy="-32" r="2.5" fill="#FFFFFF"/>
      <circle cx="24" cy="-32" r="2.5" fill="#FFFFFF"/>
      <ellipse cx="-30" cy="-12" rx="9" ry="6" fill="#FFC1CC" opacity="0.85"/>
      <ellipse cx="30" cy="-12" rx="9" ry="6" fill="#FFC1CC" opacity="0.85"/>
    </symbol>
    <symbol id="bunny-mini" viewBox="-60 -60 120 120">
      <ellipse cx="-22" cy="-14" rx="9" ry="34" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2.5"/>
      <ellipse cx="-22" cy="-8" rx="4.5" ry="22" fill="#FFD3DC"/>
      <ellipse cx="22" cy="-14" rx="9" ry="34" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2.5"/>
      <ellipse cx="22" cy="-8" rx="4.5" ry="22" fill="#FFD3DC"/>
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2.5"/>
      <circle cx="-12" cy="-4" r="5" fill="#2C2C54"/>
      <circle cx="12" cy="-4" r="5" fill="#2C2C54"/>
      <circle cx="-10" cy="-6" r="2" fill="#FFFFFF"/>
      <circle cx="14" cy="-6" r="2" fill="#FFFFFF"/>
      <ellipse cx="-20" cy="8" rx="7" ry="5" fill="#FFC1CC" opacity="0.85"/>
      <ellipse cx="20" cy="8" rx="7" ry="5" fill="#FFC1CC" opacity="0.85"/>
      <ellipse cx="0" cy="14" rx="4" ry="2.5" fill="#FFC1CC"/>
      <path d="M -8 22 Q 0 30 8 22" stroke="#2C2C54" stroke-width="2" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1366" height="1024" fill="url(#bg-char-3-6)"/>

  <!-- 装饰云 -->
  <g opacity="0.5">
    <ellipse cx="180" cy="180" rx="46" ry="14" fill="#FFFFFF"/>
    <ellipse cx="200" cy="166" rx="28" ry="12" fill="#FFFFFF"/>
    <ellipse cx="1100" cy="160" rx="50" ry="16" fill="#FFFFFF"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="1366" height="96" fill="#FFFFFF" opacity="0.92"/>
  <g transform="translate(56 48)">
    <circle r="32" fill="#FFE9A8" stroke="#EAE6DD" stroke-width="2"/>
    <text y="10" font-size="28" text-anchor="middle">←</text>
  </g>
  <text x="683" y="46" font-size="22" font-weight="700" fill="#2C2C54" text-anchor="middle">汉字花园</text>
  <text x="683" y="72" font-size="14" fill="#5C5C8A" text-anchor="middle">今天认识 3 个字</text>
  <g transform="translate(1180 32)">
    <rect width="150" height="56" rx="28" fill="#A8E6CF"/>
    <text x="32" y="38" font-size="22" text-anchor="middle">⭐</text>
    <text x="60" y="38" font-size="22" text-anchor="middle">⭐</text>
    <text x="88" y="38" font-size="22" text-anchor="middle">☆</text>
    <text x="128" y="38" font-size="16" font-weight="700" fill="#1F6A4D" text-anchor="middle">2/3</text>
  </g>

  <!-- 主字卡 -->
  <g transform="translate(40 130)">
    <rect width="640" height="500" rx="36" fill="url(#hero-char)" stroke="#EAE6DD" stroke-width="3" filter="url(#shadow-char-3-6)"/>
    <!-- 标签 -->
    <g transform="translate(36 36)">
      <rect width="200" height="44" rx="22" fill="#A8E6CF"/>
      <text x="100" y="30" font-size="18" font-weight="700" fill="#1F6A4D" text-anchor="middle">🌳 家岛 · 第 2 个字</text>
    </g>
    <!-- 3000 字上下文：本岛剩余 -->
    <g transform="translate(248 36)">
      <rect width="356" height="44" rx="22" fill="#FFE9A8"/>
      <text x="178" y="30" font-size="16" font-weight="700" fill="#7A4F00" text-anchor="middle">本岛还有 253 字没学哦</text>
    </g>
    <!-- 大字 -->
    <text x="320" y="320" font-size="280" font-weight="700" fill="#E94545" text-anchor="middle">山</text>
    <!-- 拼音 -->
    <text x="320" y="380" font-size="42" font-weight="700" fill="#2C2C54" text-anchor="middle">shān</text>
    <!-- 跟 Bunny 读 -->
    <g transform="translate(36 400)">
      <rect width="568" height="72" rx="36" fill="#FFE9A8"/>
      <circle cx="40" cy="36" r="28" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
      <text x="40" y="46" font-size="22" text-anchor="middle">🔊</text>
      <text x="84" y="32" font-size="20" font-weight="700" fill="#7A4F00">点一下，Bunny 读给你听</text>
      <text x="84" y="58" font-size="14" fill="#7A4F00">再点一次，跟 Bunny 一起读</text>
    </g>
  </g>

  <!-- 右上：图示 -->
  <g transform="translate(700 130)">
    <rect width="300" height="240" rx="32" fill="#FFFFFF" stroke="#EAE6DD" stroke-width="3" filter="url(#shadow-char-3-6)"/>
    <text x="20" y="36" font-size="16" font-weight="700" fill="#5C5C8A">看，山是这样</text>
    <!-- 大山 -->
    <g transform="translate(150 140)">
      <path d="M -100 60 L -40 -50 L -10 -10 L 30 -60 L 100 60 Z" fill="#A8E6CF" stroke="#2C2C54" stroke-width="3"/>
      <path d="M -100 60 L -40 -50 L -10 -10 L 30 -60 L 100 60 Z" fill="url(#next-card-2)" opacity="0.4"/>
      <path d="M -40 -50 L -55 -30 L -25 -30 Z" fill="#FFFFFF"/>
      <path d="M 30 -60 L 16 -38 L 46 -38 Z" fill="#FFFFFF"/>
    </g>
    <text x="150" y="220" font-size="14" fill="#5C5C8A" text-anchor="middle">高高的山</text>
  </g>

  <!-- 右下：Bunny 鼓励 -->
  <g transform="translate(700 380)">
    <rect width="300" height="240" rx="32" fill="#A8E6CF" filter="url(#shadow-char-3-6)"/>
    <use href="#bunny-mini" x="20" y="50" width="120" height="120"/>
    <g transform="translate(150 60)">
      <rect width="130" height="44" rx="22" fill="#FFFFFF"/>
      <text x="65" y="30" font-size="18" font-weight="700" fill="#E94545" text-anchor="middle">真棒！</text>
    </g>
    <text x="150" y="150" font-size="16" font-weight="700" fill="#1F6A4D" text-anchor="middle">你认识「山」了</text>
    <text x="150" y="180" font-size="14" fill="#1F6A4D" text-anchor="middle">下一个字：</text>
    <!-- 下一字预览（小） -->
    <g transform="translate(120 196)">
      <rect width="60" height="36" rx="18" fill="#FFFFFF"/>
      <text x="30" y="26" font-size="22" font-weight="700" fill="#E94545" text-anchor="middle">水</text>
    </g>
  </g>

  <!-- 底部 4 步进度 -->
  <g transform="translate(40 660)">
    <text x="0" y="20" font-size="14" font-weight="700" fill="#5C5C8A">这一课的进度</text>
    <g transform="translate(0 36)">
      <!-- step 1: done -->
      <circle cx="32" cy="32" r="30" fill="#A8E6CF"/>
      <text x="32" y="42" font-size="24" font-weight="700" fill="#1F6A4D" text-anchor="middle">✓</text>
      <text x="32" y="84" font-size="12" fill="#1F6A4D" text-anchor="middle">已学 · 木</text>
      <line x1="68" y1="32" x2="100" y2="32" stroke="#A8E6CF" stroke-width="4"/>
      <!-- step 2: current -->
      <g transform="translate(100 0)">
        <circle cx="32" cy="32" r="30" fill="#E94545"/>
        <text x="32" y="42" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
        <text x="32" y="84" font-size="12" font-weight="700" fill="#E94545" text-anchor="middle">正在学 · 山</text>
      </g>
      <line x1="168" y1="32" x2="200" y2="32" stroke="#EAE6DD" stroke-width="4"/>
      <!-- step 3: next -->
      <g transform="translate(200 0)">
        <circle cx="32" cy="32" r="30" fill="#FFFFFF" stroke="#EAE6DD" stroke-width="3"/>
        <text x="32" y="40" font-size="20" font-weight="700" fill="#2C2C54" text-anchor="middle">水</text>
        <text x="32" y="84" font-size="12" fill="#5C5C8A" text-anchor="middle">下一个</text>
      </g>
      <line x1="268" y1="32" x2="300" y2="32" stroke="#EAE6DD" stroke-width="4"/>
      <!-- step 4 -->
      <g transform="translate(300 0)">
        <circle cx="32" cy="32" r="30" fill="#FFFFFF" stroke="#EAE6DD" stroke-width="3"/>
        <text x="32" y="42" font-size="20" fill="#5C5C8A" text-anchor="middle">?</text>
        <text x="32" y="84" font-size="12" fill="#5C5C8A" text-anchor="middle">小礼物</text>
      </g>
    </g>
  </g>

  <!-- 右侧：下一关的 3 个拟人化汉字方块 -->
  <g transform="translate(820 660)">
    <text x="0" y="20" font-size="14" font-weight="700" fill="#5C5C8A">下一关的字（拟人化）</text>
    <g transform="translate(0 36)">
      <rect width="160" height="200" rx="28" fill="url(#next-card-1)" filter="url(#shadow-char-3-6)"/>
      <use href="#char-eye" x="20" y="20" width="120" height="80"/>
      <text x="80" y="170" font-size="100" font-weight="700" fill="#2C2C54" text-anchor="middle">木</text>
    </g>
    <g transform="translate(180 36)">
      <rect width="160" height="200" rx="28" fill="url(#next-card-2)" filter="url(#shadow-char-3-6)"/>
      <use href="#char-eye" x="20" y="20" width="120" height="80"/>
      <text x="80" y="170" font-size="100" font-weight="700" fill="#2C2C54" text-anchor="middle">水</text>
    </g>
    <g transform="translate(360 36)">
      <rect width="146" height="200" rx="28" fill="url(#next-card-3)" filter="url(#shadow-char-3-6)"/>
      <use href="#char-eye" x="20" y="20" width="120" height="80"/>
      <text x="73" y="170" font-size="100" font-weight="700" fill="#2C2C54" text-anchor="middle">林</text>
    </g>
  </g>

  <!-- 底部 6 tab 底栏 -->
  <rect x="0" y="936" width="1366" height="88" fill="#FFFFFF" stroke="#EAE6DD" stroke-width="1"/>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <g transform="translate(114 950)"><text y="22" font-size="28" fill="#5C5C8A">🏝️</text><text y="56" fill="#5C5C8A">首页</text></g>
    <g transform="translate(341 950)"><text y="22" font-size="28" fill="#5C5C8A">📖</text><text y="56" fill="#5C5C8A">故事</text></g>
    <g transform="translate(569 950)">
      <rect x="-30" y="-8" width="60" height="60" rx="30" fill="#FFC1CC"/>
      <text y="32" font-size="28" fill="#FFFFFF">🌸</text>
      <text y="62" font-size="12" font-weight="700" fill="#7A2A4D">汉字</text>
    </g>
    <g transform="translate(797 950)"><text y="22" font-size="28" fill="#5C5C8A">🎮</text><text y="56" fill="#5C5C8A">游戏</text></g>
    <g transform="translate(1024 950)"><text y="22" font-size="28" fill="#5C5C8A">🏠</text><text y="56" fill="#5C5C8A">小屋</text></g>
    <g transform="translate(1252 950)"><text y="22" font-size="28" fill="#5C5C8A">🐰</text><text y="56" fill="#5C5C8A">家长</text></g>
  </g>
</svg>