<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!--
    Bunny · 3-6 岁专属 H5 产品原型总览
    6 屏抽样：01 首页 · 02 绘本陪读 · 03 汉字花园 · 04 玩游戏 · 05 我的小屋 · 06 跟 Bunny 读
    设计锚点：docs/prototypes/KIDS_3_6_RESEARCH.md
    设计基线：
      - 主背景渐变 #FFF4E6 → #FFE0BF → #B5DEFF
      - Bunny 角色全程出现，圆胖 1.5 头身、白毛 + 粉内耳 + 红书包 + 长垂耳
      - 主 CTA ≥ 120px；触控目标 ≥ 88px
      - 屏幕汉字 ≤ 20 个；图标为主；永不负面反馈
  -->
  <defs>
    <linearGradient id="bg-overview" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4E6"/>
      <stop offset="50%" stop-color="#FFE0BF"/>
      <stop offset="100%" stop-color="#B5DEFF"/>
    </linearGradient>
    <linearGradient id="card-overview" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF9F0"/>
    </linearGradient>
    <linearGradient id="cta-overview" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB37C"/>
      <stop offset="100%" stop-color="#E94545"/>
    </linearGradient>
    <linearGradient id="forest-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C6F0D8"/>
      <stop offset="100%" stop-color="#6FD7A0"/>
    </linearGradient>
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#FFC76B"/>
    </linearGradient>
    <linearGradient id="pond-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B5DEFF"/>
      <stop offset="100%" stop-color="#7CCFAF"/>
    </linearGradient>
    <linearGradient id="meadow-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC1CC"/>
      <stop offset="100%" stop-color="#FFC76B"/>
    </linearGradient>
    <filter id="shadow-overview"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.16"/></filter>
    <!-- 拟人化按钮眼 -->
    <symbol id="smile-eye" viewBox="-30 -30 60 60">
      <circle cx="-22" cy="-30" r="5" fill="#2C2C54"/>
      <circle cx="22" cy="-30" r="5" fill="#2C2C54"/>
      <circle cx="-20" cy="-32" r="2" fill="#FFFFFF"/>
      <circle cx="24" cy="-32" r="2" fill="#FFFFFF"/>
      <ellipse cx="-30" cy="-15" rx="8" ry="5" fill="#FFC1CC" opacity="0.85"/>
      <ellipse cx="30" cy="-15" rx="8" ry="5" fill="#FFC1CC" opacity="0.85"/>
      <ellipse cx="0" cy="-18" rx="3" ry="2" fill="#FFC1CC"/>
      <path d="M -8 -8 Q 0 -2 8 -8" stroke="#2C2C54" stroke-width="2" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1800" height="1260" fill="#F7FBFF"/>
  <text x="70" y="62" font-size="30" font-weight="700" fill="#15324B">Bunny · 3-6 岁儿童专属原型</text>
  <text x="70" y="92" font-size="15" fill="#5D7484">Open Design 风格 · 6 屏核心抽样 · 大 Bunny · 大按钮 · 拟人化图标 · 零负面反馈</text>

  <!-- 01 HOME -->
  <g transform="translate(60 130)">
    <rect width="540" height="540" rx="36" fill="url(#bg-overview)" filter="url(#shadow-overview)"/>
    <text x="22" y="36" font-size="13" font-weight="700" fill="#5D7484">01 · 世界地图 / 首页</text>
    <!-- 顶部栏 -->
    <rect x="22" y="52" width="496" height="64" rx="32" fill="#FFFFFF" opacity="0.92"/>
    <text x="22" y="92" font-size="22" font-weight="700" fill="#2C2C54">你好，小朋友！</text>
    <circle cx="478" cy="84" r="20" fill="#FFE9A8"/>
    <text x="478" y="92" font-size="20" text-anchor="middle">⭐</text>
    <text x="478" y="112" font-size="11" font-weight="700" fill="#A37A2E" text-anchor="middle">5 颗星</text>
    <!-- 4 大岛 -->
    <g transform="translate(22 132)">
      <!-- 故事岛 -->
      <ellipse cx="120" cy="100" rx="110" ry="92" fill="url(#sky-grad)"/>
      <ellipse cx="120" cy="170" rx="92" ry="22" fill="#6FD7A0" opacity="0.5"/>
      <text x="120" y="80" font-size="48" text-anchor="middle">📖</text>
      <text x="120" y="135" font-size="20" font-weight="700" fill="#2C2C54" text-anchor="middle">故事岛</text>
      <text x="120" y="158" font-size="12" fill="#5D7484" text-anchor="middle">Bunny 讲故事</text>
    </g>
    <g transform="translate(258 132)">
      <ellipse cx="120" cy="100" rx="110" ry="92" fill="url(#forest-grad)"/>
      <ellipse cx="120" cy="170" rx="92" ry="22" fill="#6FD7A0" opacity="0.5"/>
      <text x="120" y="80" font-size="48" text-anchor="middle">🌸</text>
      <text x="120" y="135" font-size="20" font-weight="700" fill="#2C2C54" text-anchor="middle">汉字花园</text>
      <text x="120" y="158" font-size="12" fill="#5D7484" text-anchor="middle">和字做朋友</text>
    </g>
    <g transform="translate(22 332)">
      <ellipse cx="120" cy="100" rx="110" ry="92" fill="url(#pond-grad)"/>
      <ellipse cx="120" cy="170" rx="92" ry="22" fill="#7CCFAF" opacity="0.5"/>
      <text x="120" y="80" font-size="48" text-anchor="middle">🎮</text>
      <text x="120" y="135" font-size="20" font-weight="700" fill="#2C2C54" text-anchor="middle">玩游戏</text>
      <text x="120" y="158" font-size="12" fill="#5D7484" text-anchor="middle">找一找</text>
    </g>
    <g transform="translate(258 332)">
      <ellipse cx="120" cy="100" rx="110" ry="92" fill="url(#meadow-grad)"/>
      <ellipse cx="120" cy="170" rx="92" ry="22" fill="#FF9F43" opacity="0.5"/>
      <text x="120" y="80" font-size="48" text-anchor="middle">🏠</text>
      <text x="120" y="135" font-size="20" font-weight="700" fill="#2C2C54" text-anchor="middle">我的小屋</text>
      <text x="120" y="158" font-size="12" fill="#5D7484" text-anchor="middle">收集勋章</text>
    </g>
  </g>

  <!-- 02 STORY -->
  <g transform="translate(620 130)">
    <rect width="540" height="540" rx="36" fill="#ECF8EA" filter="url(#shadow-overview)"/>
    <text x="22" y="36" font-size="13" font-weight="700" fill="#5D7484">02 · 绘本陪读 / Bunny 讲故事</text>
    <!-- 顶 -->
    <rect x="22" y="52" width="496" height="56" rx="28" fill="#FFFFFF" opacity="0.92"/>
    <text x="270" y="86" font-size="18" font-weight="700" fill="#2C2C54" text-anchor="middle">《小兔子找妈妈》</text>
    <!-- 大插画 -->
    <g transform="translate(22 124)">
      <rect width="496" height="220" rx="28" fill="url(#forest-grad)"/>
      <text x="248" y="120" font-size="64" text-anchor="middle">🌳 🐰</text>
      <text x="248" y="180" font-size="36" text-anchor="middle">🍄 🌲 🦋</text>
    </g>
    <!-- 当前句子 -->
    <g transform="translate(22 360)">
      <rect width="496" height="68" rx="22" fill="#FFFFFF"/>
      <circle cx="42" cy="34" r="22" fill="#FFE9A8"/>
      <text x="42" y="42" font-size="20" text-anchor="middle">🔊</text>
      <text x="80" y="44" font-size="22" font-weight="700" fill="#2C2C54">小兔子在森林里找妈妈。</text>
    </g>
    <!-- Bunny 大头像 + 大麦克风 -->
    <g transform="translate(22 444)">
      <rect width="240" height="80" rx="24" fill="#FFFFFF"/>
      <!-- mini Bunny -->
      <g transform="translate(50 40)">
        <ellipse cx="-14" cy="-14" rx="8" ry="22" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
        <ellipse cx="-14" cy="-10" rx="4" ry="14" fill="#FFD3DC"/>
        <ellipse cx="14" cy="-14" rx="8" ry="22" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
        <ellipse cx="14" cy="-10" rx="4" ry="14" fill="#FFD3DC"/>
        <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
        <circle cx="-7" cy="-3" r="3" fill="#2C2C54"/>
        <circle cx="7" cy="-3" r="3" fill="#2C2C54"/>
        <ellipse cx="-12" cy="6" rx="5" ry="3" fill="#FFC1CC"/>
        <ellipse cx="12" cy="6" rx="5" ry="3" fill="#FFC1CC"/>
        <path d="M -4 8 Q 0 12 4 8" stroke="#2C2C54" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
      <text x="110" y="38" font-size="16" font-weight="700" fill="#2C2C54">Bunny 在讲</text>
      <text x="110" y="60" font-size="12" fill="#5D7484">听一听再跟读</text>
    </g>
    <!-- 大麦克风 -->
    <g transform="translate(282 444)">
      <circle cx="60" cy="40" r="50" fill="url(#cta-overview)" stroke="#FFFFFF" stroke-width="4"/>
      <text x="60" y="58" font-size="40" text-anchor="middle">🎤</text>
      <text x="200" y="46" font-size="16" font-weight="700" fill="#2C2C54" text-anchor="middle">我也要读</text>
    </g>
  </g>

  <!-- 03 CHARACTERS -->
  <g transform="translate(1180 130)">
    <rect width="560" height="540" rx="36" fill="#FFF8EF" filter="url(#shadow-overview)"/>
    <text x="22" y="36" font-size="13" font-weight="700" fill="#5D7484">03 · 汉字花园</text>
    <text x="22" y="74" font-size="22" font-weight="700" fill="#2C2C54">今天认识 3 个字</text>
    <!-- 选中大字 -->
    <g transform="translate(22 96)">
      <rect width="240" height="240" rx="32" fill="#FFFFFF" stroke="#EAE6DD" stroke-width="3"/>
      <text x="120" y="170" font-size="140" font-weight="700" fill="#E94545" text-anchor="middle">山</text>
      <text x="120" y="210" font-size="20" font-weight="700" fill="#2C2C54" text-anchor="middle">shān</text>
      <!-- 拟人笑脸 -->
      <use href="#smile-eye" x="20" y="20" width="60" height="60"/>
    </g>
    <!-- 解释 -->
    <g transform="translate(282 96)">
      <rect width="256" height="116" rx="22" fill="#FFE9A8"/>
      <text x="22" y="34" font-size="16" font-weight="700" fill="#A37A2E">看，山是这样</text>
      <text x="22" y="84" font-size="48" text-anchor="start">⛰️</text>
      <text x="120" y="100" font-size="14" fill="#5D7484">高大的山</text>
    </g>
    <g transform="translate(282 232)">
      <rect width="256" height="104" rx="22" fill="#A8E6CF"/>
      <text x="22" y="34" font-size="16" font-weight="700" fill="#1F6A4D">跟 Bunny 读一遍</text>
      <circle cx="40" cy="68" r="20" fill="#FFE9A8"/>
      <text x="40" y="76" font-size="22" text-anchor="middle">🔊</text>
      <text x="76" y="74" font-size="16" font-weight="700" fill="#2C2C54">山、山、山</text>
    </g>
    <!-- 三个拟人汉字 -->
    <g transform="translate(22 360)">
      <text x="0" y="20" font-size="13" font-weight="700" fill="#5D7484">下一关的字（拟人化）</text>
      <g transform="translate(0 36)">
        <rect width="160" height="120" rx="24" fill="#FFC1CC"/>
        <text x="80" y="92" font-size="72" font-weight="700" fill="#2C2C54" text-anchor="middle">木</text>
        <use href="#smile-eye" x="38" y="-8" width="80" height="80"/>
      </g>
      <g transform="translate(176 36)">
        <rect width="160" height="120" rx="24" fill="#B5DEFF"/>
        <text x="80" y="92" font-size="72" font-weight="700" fill="#2C2C54" text-anchor="middle">水</text>
        <use href="#smile-eye" x="38" y="-8" width="80" height="80"/>
      </g>
      <g transform="translate(352 36)">
        <rect width="160" height="120" rx="24" fill="#A8E6CF"/>
        <text x="80" y="92" font-size="72" font-weight="700" fill="#2C2C54" text-anchor="middle">林</text>
        <use href="#smile-eye" x="38" y="-8" width="80" height="80"/>
      </g>
    </g>
  </g>

  <!-- 04 GAME -->
  <g transform="translate(60 700)">
    <rect width="540" height="500" rx="36" fill="#F3F9FF" filter="url(#shadow-overview)"/>
    <text x="22" y="36" font-size="13" font-weight="700" fill="#5D7484">04 · 玩游戏 · 找一找</text>
    <!-- Bunny 提示 -->
    <g transform="translate(22 56)">
      <rect width="496" height="80" rx="24" fill="#FFFFFF"/>
      <g transform="translate(40 40)">
        <ellipse cx="-10" cy="-10" rx="6" ry="18" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
        <ellipse cx="10" cy="-10" rx="6" ry="18" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
        <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
        <circle cx="-7" cy="-3" r="3" fill="#2C2C54"/>
        <circle cx="7" cy="-3" r="3" fill="#2C2C54"/>
        <ellipse cx="-12" cy="6" rx="5" ry="3" fill="#FFC1CC"/>
        <ellipse cx="12" cy="6" rx="5" ry="3" fill="#FFC1CC"/>
      </g>
      <text x="80" y="38" font-size="20" font-weight="700" fill="#2C2C54">哪个是「山」呀？</text>
      <text x="80" y="62" font-size="14" fill="#5D7484">点一下你看见的那个字</text>
    </g>
    <!-- 大场景 -->
    <g transform="translate(22 152)">
      <rect width="496" height="160" rx="24" fill="url(#sky-grad)"/>
      <text x="248" y="92" font-size="64" text-anchor="middle">⛰️ 🌳 🏞️</text>
      <text x="248" y="138" font-size="14" font-weight="700" fill="#5D7484" text-anchor="middle">大山里有三座山峰</text>
    </g>
    <!-- 三个字按钮 -->
    <g transform="translate(22 332)">
      <rect width="148" height="148" rx="28" fill="#FFFFFF" stroke="#EAE6DD" stroke-width="3"/>
      <text x="74" y="108" font-size="80" font-weight="700" fill="#2C2C54" text-anchor="middle">木</text>
    </g>
    <g transform="translate(186 332)">
      <rect width="148" height="148" rx="28" fill="#A8E6CF" stroke="#39B86A" stroke-width="6"/>
      <text x="74" y="108" font-size="80" font-weight="700" fill="#2C2C54" text-anchor="middle">山</text>
      <circle cx="124" cy="22" r="18" fill="#39B86A"/>
      <text x="124" y="30" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
    </g>
    <g transform="translate(350 332)">
      <rect width="148" height="148" rx="28" fill="#FFFFFF" stroke="#EAE6DD" stroke-width="3"/>
      <text x="74" y="108" font-size="80" font-weight="700" fill="#2C2C54" text-anchor="middle">水</text>
    </g>
  </g>

  <!-- 05 BADGES -->
  <g transform="translate(620 700)">
    <rect width="540" height="500" rx="36" fill="#FFF8FB" filter="url(#shadow-overview)"/>
    <text x="22" y="36" font-size="13" font-weight="700" fill="#5D7484">05 · 我的小屋 · 收集勋章</text>
    <!-- Bunny 说话 -->
    <g transform="translate(22 56)">
      <rect width="496" height="80" rx="24" fill="#FFE9A8"/>
      <g transform="translate(40 40)">
        <ellipse cx="-10" cy="-10" rx="6" ry="18" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
        <ellipse cx="10" cy="-10" rx="6" ry="18" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
        <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
        <circle cx="-7" cy="-3" r="3" fill="#2C2C54"/>
        <circle cx="7" cy="-3" r="3" fill="#2C2C54"/>
        <ellipse cx="-12" cy="6" rx="5" ry="3" fill="#FFC1CC"/>
        <ellipse cx="12" cy="6" rx="5" ry="3" fill="#FFC1CC"/>
        <path d="M -4 8 Q 0 14 4 8" stroke="#2C2C54" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
      <text x="80" y="38" font-size="20" font-weight="700" fill="#2C2C54">今天又找到了 3 颗星</text>
      <text x="80" y="62" font-size="14" fill="#5D7484">把勋章挂到墙上吧！</text>
    </g>
    <!-- 勋章网格 -->
    <g transform="translate(22 152)">
      <rect width="148" height="148" rx="28" fill="#FFD15C"/>
      <text x="74" y="92" font-size="60" text-anchor="middle">🌟</text>
      <text x="74" y="124" font-size="14" font-weight="700" fill="#7A4F00" text-anchor="middle">第一天</text>
    </g>
    <g transform="translate(186 152)">
      <rect width="148" height="148" rx="28" fill="#A8E6CF"/>
      <text x="74" y="92" font-size="60" text-anchor="middle">📖</text>
      <text x="74" y="124" font-size="14" font-weight="700" fill="#1F6A4D" text-anchor="middle">小读者</text>
    </g>
    <g transform="translate(350 152)">
      <rect width="148" height="148" rx="28" fill="#FFC1CC"/>
      <text x="74" y="92" font-size="60" text-anchor="middle">🌸</text>
      <text x="74" y="124" font-size="14" font-weight="700" fill="#7A2A4D" text-anchor="middle">汉字朋友</text>
    </g>
    <g transform="translate(22 316)">
      <rect width="148" height="148" rx="28" fill="#B5DEFF" opacity="0.5"/>
      <text x="74" y="98" font-size="44" text-anchor="middle">❓</text>
      <text x="74" y="124" font-size="12" font-weight="700" fill="#3F4C7A" text-anchor="middle">下一关解锁</text>
    </g>
    <g transform="translate(186 316)">
      <rect width="148" height="148" rx="28" fill="#D9C2F0" opacity="0.5"/>
      <text x="74" y="98" font-size="44" text-anchor="middle">❓</text>
      <text x="74" y="124" font-size="12" font-weight="700" fill="#7B5EAB" text-anchor="middle">下一关解锁</text>
    </g>
    <g transform="translate(350 316)">
      <rect width="148" height="148" rx="28" fill="#FFE9A8" opacity="0.5"/>
      <text x="74" y="98" font-size="44" text-anchor="middle">❓</text>
      <text x="74" y="124" font-size="12" font-weight="700" fill="#A37A2E" text-anchor="middle">下一关解锁</text>
    </g>
  </g>

  <!-- 06 READ-ALONG -->
  <g transform="translate(1180 700)">
    <rect width="560" height="500" rx="36" fill="#F5F3FF" filter="url(#shadow-overview)"/>
    <text x="22" y="36" font-size="13" font-weight="700" fill="#5D7484">06 · 跟 Bunny 读 · 鼓励优先</text>
    <!-- 当前句 -->
    <g transform="translate(22 56)">
      <rect width="516" height="80" rx="24" fill="#FFFFFF"/>
      <text x="40" y="48" font-size="28" font-weight="700" fill="#2C2C54">小兔子在</text>
      <rect x="220" y="22" width="160" height="44" rx="20" fill="#A8E6CF"/>
      <text x="300" y="56" font-size="28" font-weight="700" fill="#1F6A4D" text-anchor="middle">森林里</text>
    </g>
    <!-- 大麦克风 -->
    <g transform="translate(180 152)">
      <circle cx="100" cy="100" r="100" fill="#FFC1CC" opacity="0.4"/>
      <circle cx="100" cy="100" r="80" fill="#FFC1CC" opacity="0.6"/>
      <circle cx="100" cy="100" r="64" fill="url(#cta-overview)" stroke="#FFFFFF" stroke-width="6"/>
      <text x="100" y="124" font-size="56" text-anchor="middle">🎤</text>
    </g>
    <!-- Bunny 鼓励 -->
    <g transform="translate(22 372)">
      <rect width="516" height="80" rx="24" fill="#A8E6CF"/>
      <g transform="translate(40 40)">
        <ellipse cx="-10" cy="-10" rx="6" ry="18" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
        <ellipse cx="10" cy="-10" rx="6" ry="18" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
        <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#2C2C54" stroke-width="2"/>
        <circle cx="-7" cy="-3" r="3" fill="#2C2C54"/>
        <circle cx="7" cy="-3" r="3" fill="#2C2C54"/>
        <ellipse cx="-12" cy="6" rx="5" ry="3" fill="#FFC1CC"/>
        <ellipse cx="12" cy="6" rx="5" ry="3" fill="#FFC1CC"/>
        <path d="M -4 8 Q 0 14 4 8" stroke="#2C2C54" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
      <text x="80" y="38" font-size="22" font-weight="700" fill="#1F6A4D">太棒了！像小小朗诵家！</text>
      <text x="80" y="62" font-size="14" fill="#1F6A4D">再读一遍，会更清楚哦～</text>
    </g>
    <text x="22" y="476" font-size="13" fill="#5D7484" text-anchor="start">无分数 / 无红叉 / Bunny 永远鼓励</text>
  </g>

  <text x="70" y="1232" font-size="13" fill="#5D7484">Prototype principle: Story-led · Bunny-led · Big touch · Big Bunny · Picture-first · Zero failure · Open Design Bunny style</text>
</svg>