<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff1ff"/><stop offset="1" stop-color="#fff7e6"/></linearGradient>
  <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7e89d"/><stop offset="1" stop-color="#78c878"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".15"/></filter>
  <style>
    .title{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:28px;font-weight:700;fill:#15324b}
    .h1{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:25px;font-weight:700;fill:#15324b}
    .body{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#29445a}
    .small{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;fill:#567083}
    .pill{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;font-weight:700;fill:#15324b}
  </style>
</defs>
<rect width="1800" height="1260" fill="#f7fbff"/>
<text x="70" y="70" class="title">Bunny · H5 产品原型总览</text>
<text x="70" y="104" class="small">以人教版 1–2 年级语文为课程底座：绘本陪读 + 汉字来历 + 游戏冒险 + AI 个性化学习</text>
<g transform="translate(70,145)"><rect width="520" height="470" rx="34" fill="url(#sky)" filter="url(#shadow)"/><circle cx="85" cy="75" r="42" fill="#fff" opacity=".9"/><text x="58" y="85" font-size="40">🐰</text><text x="155" y="90" font-size="43" font-family="Arial" font-weight="700" fill="#20445f">Bunny</text><text x="260" y="122" text-anchor="middle" class="small">会陪孩子读书、讲汉字故事、玩游戏</text><rect x="55" y="275" width="180" height="115" rx="28" fill="#fff0a5"/><text x="145" y="320" text-anchor="middle" font-size="42">📖</text><text x="145" y="356" text-anchor="middle" class="pill">故事王国</text><rect x="285" y="275" width="180" height="115" rx="28" fill="#d9f7df"/><text x="375" y="320" text-anchor="middle" font-size="42">🏛️</text><text x="375" y="356" text-anchor="middle" class="pill">汉字博物馆</text><rect x="55" y="405" width="180" height="35" rx="17" fill="#7cd4ee"/><text x="145" y="429" text-anchor="middle" class="pill">🎮 冒险乐园</text><rect x="285" y="405" width="180" height="35" rx="17" fill="#ffc76b"/><text x="375" y="429" text-anchor="middle" class="pill">🔍 汉字探秘局</text></g>
<g transform="translate(640,145)"><rect width="520" height="470" rx="34" fill="#ecf8ea" filter="url(#shadow)"/><rect x="25" y="20" width="470" height="60" rx="25" fill="#fff" opacity=".88"/><text x="55" y="59" class="body">‹</text><text x="260" y="58" text-anchor="middle" class="h1">《小兔子找妈妈》 3/8</text><rect x="25" y="100" width="470" height="170" rx="24" fill="url(#forest)"/><text x="260" y="165" text-anchor="middle" font-size="62">🐰 🌳 🐇</text><text x="260" y="225" text-anchor="middle" class="body">小兔子在森林里找妈妈。</text><rect x="25" y="290" width="470" height="95" rx="24" fill="#fff"/><text x="55" y="330" font-size="20">🔊</text><text x="95" y="330" class="body">小兔子在</text><rect x="210" y="305" width="105" height="37" rx="18" fill="#bdf0c8"/><text x="262" y="331" text-anchor="middle" class="pill">森林里</text><text x="330" y="330" class="body">找妈妈。</text><rect x="55" y="400" width="125" height="45" rx="22" fill="#ffd77c"/><text x="117" y="429" text-anchor="middle" class="pill">🐰 Bunny讲</text><rect x="198" y="400" width="125" height="45" rx="22" fill="#7edcf2"/><text x="260" y="429" text-anchor="middle" class="pill">🎤 一起读</text><rect x="341" y="400" width="125" height="45" rx="22" fill="#c9b5ff"/><text x="404" y="429" text-anchor="middle" class="pill">💬 角色对读</text></g>
<g transform="translate(1210,145)"><rect width="520" height="470" rx="34" fill="#fff8ef" filter="url(#shadow)"/><text x="35" y="55" class="h1">汉字故事 · 山</text><text x="440" y="55" font-size="22">🔊</text><rect x="30" y="80" width="155" height="125" rx="22" fill="#fff" stroke="#f2cfa6"/><text x="107" y="165" text-anchor="middle" font-size="95">山</text><text x="240" y="120" class="small">shān</text><text x="240" y="158" class="h1">山，就是高高的山。</text><rect x="25" y="225" width="470" height="105" rx="22" fill="#e6f7ea"/><text x="50" y="257" class="pill">汉字时光机</text><text x="75" y="300" font-size="36">⛰️ → 𐀀 → 山 → 山</text><text x="260" y="318" text-anchor="middle" class="small">真实的山 · 古人图画 · 古文字 · 今天的汉字</text><rect x="25" y="350" width="470" height="75" rx="22" fill="#fff"/><text x="48" y="382" class="pill">💡 发现</text><text x="120" y="382" class="body">“山”为什么像三座山峰？</text><text x="120" y="410" class="small">看图 → 听故事 → 自己说一遍</text><rect x="150" y="438" width="220" height="30" rx="15" fill="#ff9f43"/><text x="260" y="460" text-anchor="middle" class="pill">开始汉字探秘</text></g>
<g transform="translate(70,665)"><rect width="520" height="470" rx="34" fill="#f3f9ff" filter="url(#shadow)"/><text x="30" y="52" class="h1">汉字游戏 · 森林寻宝</text><text x="425" y="52" font-size="24">⭐ ⭐ ☆</text><rect x="30" y="78" width="460" height="62" rx="26" fill="#dff3ff"/><text x="260" y="116" text-anchor="middle" class="body">森林里有 3 座山，哪个是“山”？</text><rect x="30" y="165" width="140" height="120" rx="24" fill="#fff" stroke="#d8e8f1"/><text x="100" y="235" text-anchor="middle" font-size="55">🌄</text><rect x="190" y="165" width="140" height="120" rx="24" fill="#d9f7df" stroke="#39b86a" stroke-width="4"/><text x="260" y="235" text-anchor="middle" font-size="55">⛰️</text><text x="300" y="180" font-size="20">✓</text><rect x="350" y="165" width="140" height="120" rx="24" fill="#fff" stroke="#d8e8f1"/><text x="420" y="235" text-anchor="middle" font-size="55">🌊</text><rect x="55" y="315" width="410" height="62" rx="30" fill="#fff"/><text x="75" y="353" font-size="26">🐰</text><text x="115" y="354" class="body">太棒了！你找到了正确的字！</text><rect x="205" y="397" width="110" height="50" rx="25" fill="#ffd15c"/><text x="260" y="430" text-anchor="middle" class="pill">⭐ +10</text></g>
<g transform="translate(640,665)"><rect width="520" height="470" rx="34" fill="#edfaff" filter="url(#shadow)"/><text x="30" y="52" class="h1">🎤 跟读练习 · AI 反馈</text><rect x="30" y="85" width="460" height="68" rx="28" fill="#fff"/><text x="58" y="128" font-size="20">🔊</text><text x="95" y="128" class="body">小兔子在</text><rect x="205" y="103" width="105" height="38" rx="19" fill="#bdf0c8"/><text x="257" y="128" text-anchor="middle" class="pill">森林里</text><text x="325" y="128" class="body">找妈妈。</text><circle cx="260" cy="240" r="82" fill="#ff9f43"/><text x="260" y="258" text-anchor="middle" font-size="58">🎤</text><text x="260" y="350" text-anchor="middle" class="body">你读得很棒！继续加油！</text><text x="70" y="395" class="small">流利度</text><text x="190" y="395" class="pill">⭐⭐⭐</text><text x="300" y="395" class="small">完整度</text><text x="400" y="395" class="pill">⭐⭐⭐</text><rect x="170" y="418" width="180" height="36" rx="18" fill="#7cd4ee"/><text x="260" y="442" text-anchor="middle" class="pill">再读一次</text></g>
<g transform="translate(1210,665)"><rect width="520" height="470" rx="34" fill="#fff8fb" filter="url(#shadow)"/><text x="30" y="52" class="h1">学习报告 · 成长看得见</text><circle cx="145" cy="185" r="82" fill="#e7f7ed" stroke="#39b86a" stroke-width="18"/><text x="145" y="182" text-anchor="middle" font-size="34" font-weight="700" fill="#258050">78%</text><text x="145" y="210" text-anchor="middle" class="small">识字掌握率</text><text x="285" y="120" class="body">今日学习</text><text x="285" y="150" class="h1">12 个新字</text><text x="285" y="190" class="body">已读绘本</text><text x="285" y="220" class="h1">3 本</text><text x="285" y="260" class="body">跟读次数</text><text x="285" y="290" class="h1">6 次</text><rect x="40" y="325" width="440" height="82" rx="24" fill="#fff"/><text x="65" y="355" class="pill">本周成长</text><text x="65" y="386" class="small">听故事 → 认识汉字 → 字源故事 → 跟读 → 自己读 → 游戏 → 理解 → 复习</text><rect x="120" y="425" width="280" height="34" rx="17" fill="#bdf0c8"/><text x="260" y="447" text-anchor="middle" class="pill">🐰 “每天 10 分钟，爱上中文阅读”</text></g>
<text x="70" y="1205" class="small">Prototype principle: Story-led · Read-aloud-first · Character-origin curiosity · Game as mission · AI personalization · H5 componentized</text>
</svg>