<g transform="translate(1215,595)"><rect width="540" height="480" rx="30" fill="#fffaf0" filter="url(#shadow)"/><text x="25" y="40" class="h">06 每日学习计划 / AI 推荐</text><text x="25" y="75" class="b">预计 18 分钟 · 根据最近表现生成</text><rect x="25" y="100" width="490" height="65" rx="22" fill="#fff"/><text x="45" y="128" class="p">1 复习弱字</text><text x="45" y="150" class="s">山、木、林 · 预计 3 分钟</text><rect x="25" y="180" width="490" height="65" rx="22" fill="#fff"/><text x="45" y="208" class="p">2 绘本陪读</text><text x="45" y="230" class="s">《小兔子找妈妈》3～5页 · 预计 6 分钟</text><rect x="25" y="260" width="490" height="65" rx="22" fill="#fff"/><text x="45" y="288" class="p">3 汉字探秘</text><text x="45" y="310" class="s">发现“森”为什么由多个“木”组成 · 3 分钟</text><rect x="25" y="340" width="490" height="65" rx="22" fill="#fff"/><text x="45" y="368" class="p">4 跟读 + 理解</text><text x="45" y="390" class="s">读 2 句话并回答一个问题 · 6 分钟</text><rect x="155" y="425" width="230" height="38" rx="19" fill="#6ad2a0"/><text x="270" y="450" text-anchor="middle" class="p">▶ 开始今天的冒险</text></g>

