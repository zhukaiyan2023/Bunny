<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#FFC1CC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g transform="translate(400,300)">
    <!-- House -->
    <rect x="-60" y="-40" width="120" height="80" fill="#FFFFFF" stroke="#7A4F00" stroke-width="3" rx="6"/>
    <polygon points="-70,-40 0,-90 70,-40" fill="#E94545" stroke="#7A4F00" stroke-width="3"/>
    <rect x="-15" y="0" width="30" height="40" fill="#7A4F00"/>
    <rect x="-40" y="-20" width="20" height="20" fill="#B5DEFF" stroke="#7A4F00" stroke-width="2"/>
    <rect x="20" y="-20" width="20" height="20" fill="#B5DEFF" stroke="#7A4F00" stroke-width="2"/>
    <!-- Family -->
    <ellipse cx="-110" cy="40" rx="20" ry="35" fill="#39B86A"/>
    <ellipse cx="110" cy="40" rx="20" ry="35" fill="#FFC1CC"/>
    <circle cx="-110" cy="20" r="22" fill="#FFFFFF" stroke="#2C2C54" stroke-width="3"/>
  </g>
  <text x="400" y="500" text-anchor="middle" font-size="48" font-family="sans-serif" font-weight="bold" fill="#7A4F00">My Family</text>
</svg>